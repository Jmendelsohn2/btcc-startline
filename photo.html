<!DOCTYPE html>
<html lang="en" style="background:#0a0a0a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BTCC Startline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="stylesheet" href="nav.css">
<title>Send Photo to Clerk</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#0a0a0a}
  body{color:#f0f0f0;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column}
  .form{flex:1;padding:14px 16px 24px}
  .lbl{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c;margin:18px 2px 7px}
  .lbl:first-child{margin-top:4px}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:11px;padding:4px 12px}
  .fieldrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 2px;border-bottom:1px solid #232323}
  .fieldrow:last-child{border-bottom:none}
  .fieldrow > span{font-size:15px;color:#fff}
  select,input[type=text],input[type=number],input[type=time]{background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:16px;text-align:right;-webkit-appearance:none;appearance:none;color-scheme:dark;max-width:62%}
  select{text-align-last:right}
  input::placeholder{color:#666}
  .full{width:100%;text-align:left;max-width:100%;padding:11px 2px;font-size:16px}
  .switch{position:relative;width:46px;height:28px;flex:none}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
  .switch .track{position:absolute;inset:0;background:#3a3a3a;border-radius:14px;transition:background .15s}
  .switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:left .15s}
  .switch input:checked + .track{background:#00c853}
  .switch input:checked + .track + .knob{left:21px}
  .btn{display:block;width:100%;margin-top:22px;background:#c9a84c;color:#0a0a0a;border:none;border-radius:12px;padding:15px 0;font-family:inherit;font-size:16px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase}
  .btn:disabled{background:#242424;color:#666}
  .btn:active:not(:disabled){opacity:.85}
  .status{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;line-height:1.5;display:none}
  .status.show{display:block}
  .status.sending{background:#12233a;color:#5aa9e6}
  .status.ok{background:#0d1f0d;color:#4fd06a}
  .status.warn{background:#3a2600;color:#ffbf4d}
  .status.fail{background:#3a0d0d;color:#ff6b6b}
  .again{display:block;text-align:center;margin-top:14px;color:#3a9de8;font-size:14px;font-weight:600;text-decoration:none}
  .hint{font-size:11px;color:#666;text-align:center;margin-top:10px;line-height:1.5}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;padding:10px 2px}
  .thumb{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;background:#000}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;padding:0}
  .addphoto{display:block;width:100%;text-align:left;background:#161616;border:1px solid #2a2a2a;border-radius:11px;color:#3a9de8;font-family:inherit;font-size:15px;font-weight:600;padding:13px 12px}
</style>
</head>
<body data-tool="photo">
<div class="form">

  <div class="lbl">Send report to</div>
  <div class="card">
    <label class="fieldrow"><span>Ops Clerk</span>
      <select id="clerk">
        <option value="jmendelsohn.barc@gmail.com">Josh Mendelsohn</option>
        <option value="ksalmons.barc@gmail.com">Kieron Salmons</option>
      </select>
    </label>
    <input id="marshal" class="full" type="text" placeholder="Your name / post number" autocomplete="off">
  </div>

  <div class="lbl">Photos</div>
  <div id="thumbs" class="thumbs" hidden></div>
  <label class="addphoto">＋ <span id="addlabel">Upload photos from library</span>
    <input id="files" type="file" accept="image/*" multiple hidden>
  </label>

  <div class="lbl">Details</div>
  <div class="card">
    <label class="fieldrow"><span>Report type</span>
      <select id="rtype">
        <option>Out of position start</option>
        <option>Other</option>
      </select>
    </label>
    <input id="rtypeOther" class="full" type="text" placeholder="Describe report type" hidden>
    <label class="fieldrow"><span>Championship</span>
      <select id="champ">
        <option>BTCC</option>
        <option>Porsche Sprint Challenge</option>
        <option>Porsche Carrera Cup</option>
        <option>F4</option>
        <option>Mini Challenge</option>
        <option>Mini Challenge Trophy</option>
        <option>Caterham</option>
        <option>Guest</option>
      </select>
    </label>
    <input id="champOther" class="full" type="text" placeholder="Championship name" hidden>
    <label class="fieldrow"><span>Session</span>
      <select id="session"></select>
    </label>
    <label class="fieldrow"><span>Car number</span>
      <input id="car" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="—">
    </label>
    <label class="fieldrow"><span>More than one car</span>
      <span class="switch"><input id="multi" type="checkbox"><span class="track"></span><span class="knob"></span></span>
    </label>
    <input id="otherCars" class="full" type="text" inputmode="numeric" placeholder="Other car number(s), e.g. 17 5 23" hidden>
    <label class="fieldrow"><span>Time of incident</span>
      <input id="time" type="time">
    </label>
    <label class="fieldrow"><span>Written report to follow</span>
      <span class="switch"><input id="written" type="checkbox"><span class="track"></span><span class="knob"></span></span>
    </label>
  </div>

  <button id="go" class="btn" disabled>Finalise report</button>
  <div id="status" class="status"></div>
  <a id="again" class="again" href="photo.html" hidden>Start another report</a>
  <div class="hint" id="hint">Sends the email with the photo(s) attached, straight to the clerk.</div>
</div>

<script src="nav.js"></script>
<script>
const $ = id => document.getElementById(id);
const SEND_URL = '/.netlify/functions/send';
let photos = [];   // compressed data URLs

// remember clerk + marshal per phone
try {
  const c = localStorage.getItem('opsClerk'); if (c) $('clerk').value = c;
  const m = localStorage.getItem('reportingMarshal'); if (m) $('marshal').value = m;
} catch (e) {}
$('clerk').addEventListener('change', () => { try { localStorage.setItem('opsClerk', $('clerk').value); } catch (e) {} });
$('marshal').addEventListener('input', () => { try { localStorage.setItem('reportingMarshal', $('marshal').value.trim()); } catch (e) {} update(); });

function fillSessions(){
  const btcc = $('champ').value === 'BTCC';
  const list = btcc
    ? ['Practice','Qualifying','Qualifying Race','Race 1','Race 2','Race 3']
    : ['Practice','Qualifying','Race 1','Race 2','Race 3'];
  const cur = $('session').value;
  $('session').innerHTML = list.map(s => '<option>' + s + '</option>').join('');
  $('session').value = list.includes(cur) ? cur : 'Race 1';
}
$('champ').addEventListener('change', () => { $('champOther').hidden = $('champ').value !== 'Guest'; fillSessions(); update(); });
$('rtype').addEventListener('change', () => { $('rtypeOther').hidden = $('rtype').value !== 'Other'; update(); });
$('multi').addEventListener('change', () => { $('otherCars').hidden = !$('multi').checked; update(); });
['rtypeOther','champOther','session','car','otherCars','time','written'].forEach(id => $(id).addEventListener('input', update));

(function(){ const d = new Date(); $('time').value = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); })();
fillSessions();

// ---- photos: compress on the phone before sending ----
function compress(file, maxDim, quality){
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      try { resolve(c.toDataURL('image/jpeg', quality)); } catch (e) { resolve(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
$('files').addEventListener('change', async e => {
  const list = [...e.target.files];
  $('addlabel').textContent = 'Adding photos…';
  for (const file of list) { const d = await compress(file, 1600, 0.68); if (d) photos.push(d); }
  e.target.value = '';
  renderThumbs();
});
function renderThumbs(){
  const box = $('thumbs');
  box.hidden = photos.length === 0;
  box.innerHTML = photos.map((d, i) => '<div class="thumb"><img src="' + d + '"><button data-i="' + i + '">✕</button></div>').join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { photos.splice(+b.dataset.i, 1); renderThumbs(); }));
  $('addlabel').textContent = photos.length ? 'Add more photos' : 'Upload photos from library';
  update();
}

// ---- report text ----
function champLabel(){ return $('champ').value === 'Guest' ? $('champOther').value.trim() : $('champ').value; }
function rtypeLabel(){ return $('rtype').value === 'Other' ? $('rtypeOther').value.trim() : $('rtype').value; }
function carList(){
  const main = $('car').value.trim();
  let list = main ? [main] : [];
  if ($('multi').checked) list = list.concat(($('otherCars').value.match(/\d+/g)) || []);
  return list;
}
function subjectLine(){
  const cars = carList().length ? 'Car ' + carList().join(' / ') : 'Car';
  return champLabel() + ' - ' + $('session').value + ' - ' + cars + ' - ' + rtypeLabel();
}
function bodyLines(){
  const lines = [
    'Reported by: ' + $('marshal').value.trim(),
    'Report type: ' + rtypeLabel(),
    'Championship: ' + champLabel(),
    'Session: ' + $('session').value,
    'Car(s): ' + (carList().join(' / ') || '—'),
    'Time of incident: ' + ($('time').value || '—')
  ];
  if ($('written').checked) lines.push('', 'Written report to follow.');
  return lines.join('\n');
}
function canGo(){
  return photos.length > 0
    && $('marshal').value.trim() !== ''
    && $('car').value.trim() !== ''
    && ($('champ').value !== 'Guest' || $('champOther').value.trim() !== '')
    && ($('rtype').value !== 'Other' || $('rtypeOther').value.trim() !== '');
}
function update(){ if (!sending) $('go').disabled = !canGo(); }

function setStatus(kind, msg){
  const s = $('status');
  s.className = 'status show ' + kind;
  s.textContent = msg;
}

let sending = false;
$('go').addEventListener('click', async () => {
  if (!canGo() || sending) return;
  sending = true;
  $('go').disabled = true;
  $('again').hidden = true;
  setStatus('sending', 'Sending…');

  const payload = { to: $('clerk').value, subject: subjectLine(), text: bodyLines(), photos: photos };

  try {
    const res = await fetch(SEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    let out = {};
    try { out = await res.json(); } catch (e) {}
    if (res.ok && out.ok) {
      setStatus('ok', 'Sent ✓  The clerk has it.');
      $('go').textContent = 'Sent ✓';
      $('again').hidden = false;
    } else {
      setStatus('fail', 'Did not send — ' + (out.error || ('error ' + res.status)) + '. Tap Finalise report to try again.');
      sending = false;
      $('go').disabled = false;
    }
  } catch (e) {
    setStatus('warn', 'No signal — nothing has sent yet. Keep this screen open and tap Finalise report again when you have a bar or two.');
    sending = false;
    $('go').disabled = false;
  }
});

update();
</script>
</body>
</html>
